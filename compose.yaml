services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VITE_N8N_URL: ${VITE_N8N_URL:-http://localhost:5678}
      VITE_N8N_API_KEY: ${VITE_N8N_API_KEY:-}
      VITE_N8N_WORKFLOW_ID: ${VITE_N8N_WORKFLOW_ID:-MipSJCjJ6fya9UGt}
      N8N_URL: ${N8N_URL:-http://localhost:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_WORKFLOW_ID: ${N8N_WORKFLOW_ID:-MipSJCjJ6fya9UGt}
    volumes:
      - dcsimu_data:/data
    restart: unless-stopped
volumes:
  dcsimu_data:
