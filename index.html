<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Se um HTML antigo de uma PWA apontar para assets já removidos no deploy,
      // invalida as caches e volta a pedir a página atualizada uma única vez.
      (function () {
        var key = 'dcsimu:startup-asset-recovered:v6'
        var recovering = false
        document.addEventListener('error', function (event) {
          var target = event.target
          var failedUrl = null
          if (target instanceof HTMLLinkElement && target.rel === 'stylesheet') failedUrl = target.href
          if (target instanceof HTMLScriptElement && target.type === 'module') failedUrl = target.src
          if (!failedUrl) return
          // Só assets do próprio domínio indicam um deploy antigo; fontes/CDNs externos em falha não devem apagar caches.
          try { if (new URL(failedUrl, location.href).origin !== location.origin) return } catch (_) { return }
          if (recovering) return
          try {
            if (sessionStorage.getItem(key) === failedUrl) return
            sessionStorage.setItem(key, failedUrl)
          } catch (_) { /* armazenamento indisponível */ }
          recovering = true
          Promise.all([
            ('caches' in window ? caches.keys() : Promise.resolve([])).then(function (keys) {
              return Promise.all(keys.map(function (name) { return caches.delete(name) }))
            }).catch(function () {}),
            ('serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations() : Promise.resolve([])).then(function (registrations) {
              return Promise.all(registrations.map(function (registration) { return registration.unregister() }))
            }).catch(function () {}),
          ]).then(function () {
            var url = new URL(window.location.href)
            url.searchParams.set('_fresh', String(Date.now()))
            window.location.replace(url.toString())
          })
        }, true)
      })()
    </script>
    <script>
      /* Identifica tablets sem reduzir a escala da interface: o layout adapta-se
         à largura real do dispositivo, mantendo texto e alvos de toque legíveis. */
      (function () {
        if (!window.matchMedia) return
        function apply() {
          var shortSide = Math.min(screen.width, screen.height)
          var tablet = window.matchMedia('(pointer: coarse)').matches && shortSide >= 600
          document.documentElement.setAttribute('data-tablet', tablet ? 'true' : 'false')
        }
        apply()
        window.addEventListener('orientationchange', function () { setTimeout(apply, 150) })
        window.addEventListener('resize', apply)
      })()
    </script>
    <meta name="theme-color" content="#2655e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="description" content="DC-SIMU — plataforma profissional para criar, configurar e visualizar quadros elétricos em 3D: biblioteca de componentes, esquema elétrico, Ladder/GRAFCET e simulação." />
    <title>DC-SIMU — Quadros elétricos em 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
  </head>
