<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Se um HTML antigo de uma PWA apontar para um CSS já removido no deploy,
      // invalida as caches e volta a pedir a página atualizada uma única vez.
      (function () {
        var key = 'dcsimu:stylesheet-recovered:v1'
        var recovering = false
        document.addEventListener('error', function (event) {
          var link = event.target
          if (!(link instanceof HTMLLinkElement) || link.rel !== 'stylesheet') return
          if (recovering) return
          try {
            if (sessionStorage.getItem(key) === link.href) return
            sessionStorage.setItem(key, link.href)
          } catch (_) { /* armazenamento indisponível */ }
          recovering = true
          Promise.all([
            ('caches' in window ? caches.keys() : Promise.resolve([])).then(function (keys) {
              return Promise.all(keys.map(function (name) { return caches.delete(name) }))
            }).catch(function () {}),
            ('serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations() : Promise.resolve([])).then(function (registrations) {
              return Promise.all(registrations.map(function (registration) { return registration.unregister() }))
            }).catch(function () {}),
          ]).then(function () {
            var url = new URL(window.location.href)
            url.searchParams.set('_fresh', String(Date.now()))
            window.location.replace(url.toString())
          })
        }, true)
      })()
    </script>
    <script>
      /* Tablet = mesmo layout do PC: em ecrãs tácteis com lado curto >= 600px o viewport passa a ter
         1200px de largura (limiar do modo compacto) e o navegador reduz a escala para caber. */
      (function () {
        var DESKTOP_W = 1200
        var meta = document.querySelector('meta[name="viewport"]')
        if (!meta || !window.matchMedia) return
        var phoneContent = meta.getAttribute('content')
        function apply() {
          var shortSide = Math.min(screen.width, screen.height)
          var longSide = Math.max(screen.width, screen.height)
          var tablet = window.matchMedia('(pointer: coarse)').matches && shortSide >= 600
          document.documentElement.setAttribute('data-tablet', tablet ? 'true' : 'false')
          if (!tablet) { if (meta.getAttribute('content') !== phoneContent) meta.setAttribute('content', phoneContent); return }
          var landscape = window.matchMedia('(orientation: landscape)').matches
          var deviceW = landscape ? longSide : shortSide
          var next
          if (deviceW >= DESKTOP_W) {
            next = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
          } else {
            var scale = Math.round((deviceW / DESKTOP_W) * 1000) / 1000
            next = 'width=' + DESKTOP_W + ', initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=' + scale + ', user-scalable=no, viewport-fit=cover'
          }
          if (meta.getAttribute('content') !== next) meta.setAttribute('content', next)
        }
        apply()
        window.addEventListener('orientationchange', function () { setTimeout(apply, 150) })
        window.addEventListener('resize', apply)
      })()
    </script>
    <meta name="theme-color" content="#2655e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="description" content="DC-SIMU — plataforma profissional para criar, configurar e visualizar quadros elétricos em 3D: biblioteca de componentes, esquema elétrico, Ladder/GRAFCET e simulação." />
    <title>DC-SIMU — Quadros elétricos em 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
