services:
  sandbox-certs:
    image: n8nio/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:?}
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >-
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner
        && chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls
    networks: [services]

  sandbox-api:
    image: n8nio/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:?}
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS:?}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-api-data:/var/lib/n8n-sandbox-api
      - type: volume
        source: sandbox-tls
        target: /tls
        read_only: true
        volume:
          subpath: api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [services]

  sandbox-runner-1:
    image: n8nio/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:?}
    privileged: true
    restart: unless-stopped
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?}
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY:?}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_CAPACITY_TOTAL: '2'
      SANDBOX_RUNNER_DEFAULT_MEMORY_MB: '1024'
      SANDBOX_RUNNER_DEFAULT_CPU_PERCENT: '100'
      SANDBOX_RUNNER_DEFAULT_PIDS_MAX: '256'
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: n8nio/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:?}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
    volumes:
      - type: volume
        source: sandbox-tls
        target: /tls
        read_only: true
        volume:
          subpath: runner
      - sandbox-runner-docker:/var/lib/docker
    networks: [services]

  searxng:
    image: ${SEARXNG_IMAGE:?}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
    ports:
      - '127.0.0.1:8088:8080'
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    networks: [services]

  n8n:
    image: ${N8N_IMAGE:?}
    container_name: n8n
    restart: unless-stopped
    env_file: .env.original
    depends_on:
      sandbox-api:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      N8N_INSTANCE_AI_SANDBOX_ENABLED: 'true'
      N8N_AGENTS_AI_SANDBOX_ENABLED: 'true'
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${SANDBOX_API_KEYS:?}
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng:8080
    ports:
      - '5678:5678'
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [services]

networks:
  services:
    name: n8n-services

volumes:
  n8n-data:
    external: true
    name: n8n_data
  sandbox-tls:
  sandbox-api-data:
  sandbox-runner-docker:
  searxng-cache:
